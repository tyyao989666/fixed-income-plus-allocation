base_config: hierarchical_asset_itransformer_v31_fold_scaled_mean.yaml
version: hierarchical_asset_itransformer_v32_rank_gated_mean

model:
  # The iTransformer produces conditional relative mean views. Promotion is
  # therefore based on strict-OOS cross-sectional RankIC, while transaction
  # costs remain in the path-dependent EP/PPO portfolio layer.
  blend_selection_metric: rank_ic
  residual_alpha_grid: [0.0, 1.0]
  asset_residual_alpha_grid: [0.0, 1.0]
  sleeve_residual_alpha_grid: [0.0, 1.0]

  # A promoted forecast is the raw mean view; zero is the exact mechanical
  # fallback. This avoids treating an arbitrary alpha grid as model skill.
  blend_min_rank_ic_improvement: 0.004
  blend_min_full_rank_ic_improvement: 0.002
  blend_min_absolute_rank_ic: 0.04
  blend_min_positive_subgroup_fraction: 0.60
  blend_min_bootstrap_positive_probability: 0.90
  blend_min_bootstrap_edge_ci_low: 0.0

gate:
  component_evidence_metric: rank_ic
  min_component_rank_ic_edge: 0.02

outputs:
  # Dataset and metadata are byte-for-byte identical to v31; this version only
  # changes causal deployment calibration.
  dataset_npz: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_metadata.json
  model_dir: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_models
  controller_model_dir: data_processed/hierarchical_asset_itransformer_v32_rank_gated_mean_controller_models

  asset_predictions: data_processed/hierarchical_asset_itransformer_v32_rank_gated_mean_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v32_rank_gated_mean_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_calibration_log.csv
  validation_report: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v32_rank_gated_mean_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v32_rank_gated_mean_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v32_rank_gated_mean_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v32_rank_gated_mean_point_in_time_audit.csv
