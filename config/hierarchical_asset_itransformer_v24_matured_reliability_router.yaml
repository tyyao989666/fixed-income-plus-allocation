base_config: hierarchical_asset_itransformer_v23_causal_mean_router.yaml
version: hierarchical_asset_itransformer_v24_matured_reliability_router

data:
  # The router can observe an expert's historical performance only after the
  # complete t+1..t+h label has matured, followed by one trading-day lag.
  # Candidate and baseline IC are measured on the same common asset set.
  include_expert_reliability_features: true
  expert_reliability:
    halflife_days: 42
    minimum_observations: 20
    full_confidence_observations: 60
    availability_lag_days: 1

model:
  # The fixed causal baseline is the default action. A hindsight training label
  # switches expert only when its same-date cross-sectional IC exceeds the
  # baseline by at least 0.20. This is a selective router, not a free forecaster.
  expert_oracle_mode: abstaining_best
  expert_oracle_minimum_edge: 0.20
  expert_oracle_label_smoothing: 0.02
  expert_oracle_nonbaseline_margin: 0.00

  # Strong prior and limited routing capacity prevent the conditional experts
  # from replacing the pooled-strong baseline merely by fitting noisy labels.
  expert_initial_baseline_probability: 0.95
  expert_adaptation_scale: 0.50
  expert_gate_temperature: 1.10
  expert_gate_deviation_weight: 0.12
  expert_routing_loss_weight: 0.30

  # Forecast supervision updates only the compact routing heads. The encoder is
  # learned from masked point-in-time histories without future-return labels.
  self_supervised_pretraining:
    freeze_encoder_epochs: 1000

  # A useful router must survive three matured prior OOS years. Until then its
  # deployable alpha is exactly zero and the fixed causal baseline is retained.
  blend_min_calibration_years: 3
  validation_correction_alpha: 1.0

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v24_matured_reliability_router_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v24_matured_reliability_router_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v24_matured_reliability_router_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v24_matured_reliability_router_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_gate.json
  expert_library_audit: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_expert_library_audit.csv
  expert_usage: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_expert_usage.csv
  report_md: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v24_matured_reliability_router_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v24_matured_reliability_router_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v24_matured_reliability_router_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v24_matured_reliability_router_point_in_time_audit.csv
