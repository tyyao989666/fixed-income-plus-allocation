base_config: hierarchical_asset_itransformer_v27_decision_mean.yaml
version: hierarchical_asset_itransformer_v28_role_aligned_mean

model:
  # Role-aligned horizons:
  # - the asset head ranks instruments inside each sleeve over one quarter;
  # - the sleeve head forms strategic cross-sleeve views over the same horizon
  #   but is promoted independently and may remain at the mechanical baseline;
  # - PPO handles daily execution and therefore does not need a noisy 5-day
  #   return head to drive the strategic target.
  asset_horizon_loss_weights: [0.00, 0.00, 1.00]
  sleeve_horizon_loss_weights: [0.00, 0.00, 1.00]
  validation_asset_horizon_weights: [0.00, 0.00, 1.00]
  validation_sleeve_horizon_weights: [0.00, 0.00, 1.00]
  asset_enabled_horizons_days: [60]
  sleeve_enabled_horizons_days: [60]
  asset_blend_scope: module

  # Keep the causally pretrained iTransformer representation fixed while the
  # small prediction adapters learn. This materially lowers the supervised
  # parameter count and prevents a few overlapping return windows from
  # rewriting the entire encoder.
  self_supervised_pretraining:
    freeze_encoder_epochs: 1000

  validation_asset_increment_weight: 0.50
  validation_sleeve_increment_weight: 0.50
  validation_decision_minimum_component_weight: 0.15

  # Deployment calibration uses the same cost-adjusted objective as training.
  # RankIC remains a diagnostic and is not used as a hidden risk view.
  blend_selection_metric: decision_aligned_utility
  blend_min_calibration_years: 2
  asset_residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]
  sleeve_residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]
  blend_min_decision_utility_improvement: 0.00025
  blend_min_full_decision_utility_improvement: 0.00010
  blend_min_absolute_decision_utility: 0.00010
  blend_decision_stability_penalty: 0.10
  blend_edge_stability_penalty: 0.10
  blend_min_positive_subgroup_fraction: 0.60
  blend_min_worst_year_edge: -0.00100
  blend_min_worst_regime_edge: -0.00300
  blend_bootstrap_enabled: true
  blend_bootstrap_draws: 2000
  blend_bootstrap_confidence: 0.90
  blend_bootstrap_block_multiplier: 1.0
  blend_bootstrap_seed: 20260727
  blend_min_bootstrap_positive_probability: 0.80
  blend_min_bootstrap_edge_ci_low: -0.00100

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v28_role_aligned_mean_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v28_role_aligned_mean_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v28_role_aligned_mean_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v28_role_aligned_mean_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v28_role_aligned_mean_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v28_role_aligned_mean_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v28_role_aligned_mean_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v28_role_aligned_mean_point_in_time_audit.csv

portfolio:
  asset_score_horizon_days: 60
