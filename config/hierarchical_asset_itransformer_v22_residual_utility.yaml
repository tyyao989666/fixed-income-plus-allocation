base_config: hierarchical_asset_itransformer_v21_continuous_utility.yaml
version: hierarchical_asset_itransformer_v22_residual_utility

model:
  # Learn the continuous future utility that remains after projecting out the
  # point-in-time momentum/Market-View anchor. Pairwise and listwise losses are
  # still evaluated on anchor + correction.
  prediction_target_mode: residual_rank
  orthogonal_residual: true
  residual_shrinkage_weight: 0.15

  # A checkpoint must improve the six task-by-horizon components as a group.
  # This prevents one strong horizon from hiding an inverted head elsewhere.
  validation_selection_metric: horizon_balanced_incremental
  validation_horizon_weights: [0.15, 0.55, 0.30]
  validation_horizon_minimum_component_weight: 0.25
  validation_positive_horizon_reward: 0.0
  validation_correction_alpha: 0.10

  # Validation is the expensive part on CPU. Five-epoch spacing preserves a
  # dense checkpoint path while keeping the formal 1000-epoch ceiling usable.
  validation_every_epochs: 5
  min_delta: 0.00010

  # Promotion uses only already-matured prior walk-forward forecasts. Stability
  # is measured on incremental IC relative to the fixed anchor.
  blend_min_calibration_years: 3
  asset_residual_alpha_grid: [0.00, 0.025, 0.05, 0.10, 0.15, 0.20]
  sleeve_residual_alpha_grid: [0.00, 0.025, 0.05, 0.10, 0.15, 0.20]
  blend_edge_stability_penalty: 0.10
  blend_min_rank_ic_improvement: 0.004
  blend_min_full_rank_ic_improvement: 0.002
  blend_min_positive_subgroup_fraction: 0.67
  blend_min_worst_year_edge: -0.0005
  blend_min_worst_regime_edge: -0.005
  blend_bootstrap_enabled: true
  blend_bootstrap_draws: 1000
  blend_bootstrap_confidence: 0.90
  blend_bootstrap_block_multiplier: 1.0
  blend_bootstrap_seed: 20260725
  blend_min_bootstrap_positive_probability: 0.80
  blend_min_bootstrap_edge_ci_low: -0.002

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v22_residual_utility_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v22_residual_utility_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v22_residual_utility_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v22_residual_utility_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v22_residual_utility_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v22_residual_utility_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v22_residual_utility_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v22_residual_utility_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v22_residual_utility_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v22_residual_utility_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v22_residual_utility_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v22_residual_utility_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v22_residual_utility_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v22_residual_utility_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v22_residual_utility_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v22_residual_utility_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v22_residual_utility_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v22_residual_utility_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v22_residual_utility_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v22_residual_utility_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v22_residual_utility_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v22_residual_utility_point_in_time_audit.csv
