version: hierarchical_asset_itransformer_v13_grid_path_occupancy

data:
  asset_returns: data_processed/asset_returns_daily.parquet
  macro_panel: data_processed/feature_panel_daily_v43.parquet
  state_cards: data_processed/market_state_cards_daily_v1.parquet
  sequence_length_days: 120
  horizons_days: [5, 20, 60]
  start_date: "2018-01-02"
  prediction_start: "2022-01-01"
  final_date: "2026-07-15"
  excluded_context_assets: [rate_30y]
  synthetic_rate_config: config/itransformer_daily_config.yaml
  macro_features:
    - rate_treasury_y10
    - rate_treasury_y30
    - credit_spread_aaa_3y_proxy
    - credit_spread_aa_3y_proxy
    - funding_dr007
    - funding_shibor_3m
    - cb_cb_price_median
    - cb_cb_premium_median
    - equity_csi1000_pe
    - equity_csi1000_pb
    - alt_us_10y_yield
    - alt_usd_index
    - alt_nanhua_commodity
    - alt_gold_au9999
    - alt_real_rate_proxy
    - alt_reits_distribution_yield
  local_windows_days: [5, 20, 60, 120]
  expected_return_window_days: 252
  expected_return_min_days: 126
  volatility_window_days: 60
  volatility_min_days: 40
  minimum_future_coverage: 0.90
  minimum_regime_path_coverage: 0.90
  train_stride_days: 1
  prediction_stride_days: 1
  target_clip: 4.0
  asset_downside_penalty: 0.05
  sleeve_downside_penalty: 0.15

preprocessing:
  clip: 5.0
  fast_window_days: 252
  fast_min_days: 60
  level_window_days: 756
  level_min_days: 126
  macro_delta_days: 20

model:
  d_model: 48
  n_heads: 4
  num_layers: 2
  dim_feedforward: 128
  local_n_heads: 4
  local_num_layers: 0
  local_dim_feedforward: 96
  dropout: 0.25
  asset_embedding_dim: 48
  module_embedding_dim: 48
  sleeve_architecture: factorized_regime_transition
  regime_count: 10
  transition_classes: 9
  transition_target: path_occupancy
  transition_temperature: 1.0
  transition_label_smoothing: 0.02
  transition_interaction_logit_scale: 0.10
  transition_joint_loss_weight: 0.35
  transition_axis_loss_weight: 0.65
  transition_loss_weight: 0.75
  state_payoff_interaction_penalty_weight: 0.01
  max_epochs: 1000
  batch_size: 128
  learning_rate: 0.000075
  weight_decay: 0.003
  early_stopping_enabled: true
  patience: 80
  minimum_epochs: 40
  warmup_epochs: 10
  scheduler_decay_epochs: 350
  minimum_learning_rate_ratio: 0.05
  min_delta: 0.0001
  progress_every_epochs: 10
  seeds: [17, 29, 47]
  asset_loss_weight: 1.00
  sleeve_loss_weight: 0.35
  rank_loss_weight: 0.25
  sleeve_pairwise_loss_weight: 0.25
  asset_pairwise_margin: 0.02
  sleeve_pairwise_margin: 0.10
  moe_load_balance_weight: 0.0
  moe_entropy_weight: 0.0
  uncertainty_weight: 0.05
  horizon_loss_weights: [0.25, 0.50, 0.25]
  gradient_clip: 1.0
  regime_balanced_sampling: true
  regime_sampling_power: 0.25
  regime_sampling_max_weight_ratio: 2.0
  validation_regime_balance_weight: 0.35
  validation_year_balance_weight: 0.25
  validation_subgroup_min_samples: 40
  checkpoint_rank_reward: 1.00
  checkpoint_average_top_k: 5
  checkpoint_average_max_loss_degradation: 0.01
  checkpoint_average_max_rank_degradation: 0.005
  checkpoint_average_max_objective_degradation: 0.005
  residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]
  asset_residual_alpha_grid: [0.00, 0.10, 0.25]
  sleeve_residual_alpha_grid: [0.00, 0.10, 0.25]
  baseline_weight_grid: [0.00, 0.25, 0.50, 0.75, 1.00]
  blend_validation_regime_weight: 0.35
  blend_validation_year_weight: 0.25
  blend_stability_penalty: 0.10

walk_forward:
  first_prediction_year: 2022
  validation_fraction: 0.25
  minimum_train_samples: 300
  minimum_validation_samples: 120
  purge_by_max_label_end: true

gate:
  evaluation_start: "2024-01-01"
  min_asset_rank_ic: 0.03
  min_sleeve_rank_ic: 0.03
  min_asset_incremental_rank_ic: 0.005
  min_sleeve_incremental_rank_ic: 0.005
  min_positive_year_fraction: 0.60

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v8_robust_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v8_robust_metadata.json
  model_dir: data_processed/hierarchical_asset_itransformer_v13_grid_path_occupancy_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v13_grid_path_occupancy_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v13_grid_path_occupancy_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v13_grid_path_occupancy_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v13_grid_path_occupancy_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v13_grid_path_occupancy_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v13_grid_path_occupancy_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v13_grid_path_occupancy_method_and_results.md
