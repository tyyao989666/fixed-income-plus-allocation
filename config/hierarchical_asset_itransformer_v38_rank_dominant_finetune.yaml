base_config: hierarchical_asset_itransformer_v37_rank_selected_encoder_finetune.yaml
version: hierarchical_asset_itransformer_v38_rank_dominant_finetune

model:
  # Preserve a calibrated conditional mean, but make cross-sectional ordering
  # the dominant supervised objective because that is the only neural edge
  # that has survived strict annual OOS tests so far.
  asset_loss_weight: 0.50
  sleeve_loss_weight: 0.50
  asset_pairwise_loss_weight: 1.25
  sleeve_pairwise_loss_weight: 1.25

outputs:
  model_dir: data_processed/hierarchical_asset_itransformer_v38_rank_dominant_finetune_models
  controller_model_dir: data_processed/hierarchical_asset_itransformer_v38_rank_dominant_finetune_controller_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v38_rank_dominant_finetune_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v38_rank_dominant_finetune_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v38_rank_dominant_finetune_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v38_rank_dominant_finetune_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v38_rank_dominant_finetune_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v38_rank_dominant_finetune_point_in_time_audit.csv
