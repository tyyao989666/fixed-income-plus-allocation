daily_timing_v2:
  experiment_name: itransformer_daily_v2_64d_2l_4h
  d_model: 64
  n_heads: 4
  num_layers: 2
  dropout: 0.25
  epochs: 300
  early_stopping_min_delta: 0.0001
  progress_every_epochs: 10
  torch_num_threads: 8
  torch_num_interop_threads: 1
  write_all_horizons: true

outputs:
  timing_v2_model: data_processed/itransformer_daily_timing_v2_challenger_model.pt
  timing_v2_predictions: data_processed/itransformer_daily_timing_v2_challenger_predictions.parquet
  timing_v2_cv_report: output/reports/itransformer_daily_timing_v2_challenger_cv_report.csv
  timing_v2_training_log: output/reports/itransformer_daily_timing_v2_challenger_training_log.csv
  timing_v2_gate_report: output/reports/itransformer_daily_timing_v2_challenger_formal_gate.json
