base_config: hierarchical_asset_itransformer_v24_matured_reliability_router.yaml
version: hierarchical_asset_itransformer_v25_forward_skill_router

data:
  # Supervise the router with a lower-noise expected expert edge. For an issue
  # date t, the label averages expert-minus-baseline rank IC over t..t+19.
  # The label is unavailable until the final issue date's complete horizon has
  # matured; WindowDataset applies that separate maturity timestamp.
  include_forward_expert_skill_targets: true
  forward_expert_skill_target:
    window_days: 20
    minimum_observations: 10
    halflife_days: 10
    clip: 1.0

model:
  expert_oracle_source: forward_smoothed_edge
  expert_oracle_mode: abstaining_soft
  # Four candidates create a mechanical winner's-curse. A 0.15 smoothed-IC
  # hurdle makes "stay with baseline" a genuine and frequent class.
  expert_oracle_minimum_edge: 0.15
  expert_oracle_temperature: 0.08
  expert_oracle_label_smoothing: 0.01

  # Start almost exactly at the fixed causal anchor. The network earns only a
  # bounded conditional deviation, while alpha deployment remains governed by
  # matured prior walk-forward years.
  expert_initial_baseline_probability: 0.98
  expert_adaptation_scale: 0.40
  expert_gate_temperature: 1.10
  expert_gate_deviation_weight: 0.20
  expert_routing_loss_weight: 0.20

  learning_rate: 0.00003
  minimum_epochs: 20
  patience: 25
  validation_every_epochs: 5
  self_supervised_pretraining:
    freeze_encoder_epochs: 1000

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v25_forward_skill_router_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v25_forward_skill_router_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v25_forward_skill_router_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v25_forward_skill_router_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_gate.json
  expert_library_audit: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_expert_library_audit.csv
  expert_usage: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_expert_usage.csv
  report_md: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v25_forward_skill_router_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v25_forward_skill_router_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v25_forward_skill_router_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v25_forward_skill_router_point_in_time_audit.csv
