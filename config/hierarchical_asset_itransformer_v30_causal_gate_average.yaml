base_config: hierarchical_asset_itransformer_v29_zero_view_module_heads.yaml
version: hierarchical_asset_itransformer_v30_causal_gate_average

model:
  # The exact-zero candidate is the benchmark for every promotion test.
  deployment_fallback_baseline_weight: 0.00

  # Each frozen-encoder component is averaged across separated validation
  # checkpoints. This reduces dependence on one noisy best epoch while keeping
  # the five asset heads and the sleeve head independent.
  component_checkpoint_minimum_epochs: 20
  component_checkpoint_average_top_k: 3
  component_checkpoint_candidate_pool_size: 24
  component_checkpoint_minimum_spacing_epochs: 10

  # A model view is promoted only when a 60-trading-day paired block bootstrap
  # has a non-negative lower confidence bound on already-matured OOS utility.
  blend_min_bootstrap_positive_probability: 0.90
  blend_min_bootstrap_edge_ci_low: 0.00000

gate:
  min_component_observations: 40
  min_component_effective_observations: 8
  min_component_years: 2
  min_component_decision_utility: 0.00000
  min_component_positive_year_fraction: 0.50
  min_component_positive_quarter_fraction: 0.50
  component_bootstrap_draws: 2000
  component_bootstrap_confidence: 0.90
  component_bootstrap_block_multiplier: 1.0
  component_bootstrap_seed: 20260727
  min_component_bootstrap_positive_probability: 0.80
  min_component_bootstrap_ci_low: 0.00000

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v30_causal_gate_average_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v30_causal_gate_average_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v30_causal_gate_average_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v30_causal_gate_average_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v30_causal_gate_average_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v30_causal_gate_average_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v30_causal_gate_average_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v30_causal_gate_average_point_in_time_audit.csv
