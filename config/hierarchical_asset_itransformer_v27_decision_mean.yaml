base_config: hierarchical_asset_itransformer_v22_residual_utility.yaml
version: hierarchical_asset_itransformer_v27_decision_mean

data:
  # Predict an annualized relative mean view. Unlike the former utility label,
  # a quiet future cross-section is not rescaled to unit variance.
  target_mode: relative_mean_return
  relative_mean_return_clip: 1.50
  momentum_baseline_windows_days: [20, 120, 252]
  momentum_baseline_weights: [0.20, 0.30, 0.50]
  sleeve_momentum_baseline_weight: 0.70
  sleeve_mechanical_view_weight: 0.30
  mechanical_view_mean_return_scale: 0.10

model:
  prediction_target_mode: anchored_rank_boost
  prediction_head_mode: unconstrained
  orthogonal_residual: false

  # The network can express a novel state-dependent mean view, but it cannot
  # inflate a tiny prediction into an arbitrary optimizer input.
  prediction_output_activation: tanh
  asset_prediction_output_scale: 0.08
  sleeve_prediction_output_scale: 0.06
  training_correction_scale: 1.0
  residual_shrinkage_weight: 0.10

  # Regression preserves economically meaningful scale. Pairwise loss ignores
  # differences close to implementation noise and weights larger spreads more.
  asset_loss_weight: 0.10
  sleeve_loss_weight: 0.15
  asset_pairwise_loss_weight: 0.70
  sleeve_pairwise_loss_weight: 0.90
  listwise_rank_loss_weight: 0.0
  asset_pairwise_minimum_margin: [0.120, 0.050, 0.025]
  sleeve_pairwise_minimum_margin: [0.120, 0.050, 0.025]
  asset_pairwise_importance_scale: [0.40, 0.25, 0.15]
  sleeve_pairwise_importance_scale: [0.40, 0.25, 0.15]
  pairwise_importance_power: 0.50
  pairwise_maximum_importance: 4.0

  # Decision-focused surrogate: compare the predicted mean-view shadow
  # allocation with the causal anchor after a one-way 5 bp implementation cost.
  # Covariance is not learned here and remains an EP/skfolio input.
  decision_horizons_days: [5, 20, 60]
  decision_transaction_cost_bps: 5.0
  asset_decision_temperature: [0.16, 0.13, 0.11]
  sleeve_decision_temperature: [0.14, 0.11, 0.09]
  decision_utility_scale: [0.080, 0.050, 0.030]
  asset_decision_loss_weight: 20.0
  sleeve_decision_loss_weight: 30.0

  # Five-day direction is intentionally secondary; PPO will handle daily
  # execution timing after EP has produced the unique target.
  horizon_loss_weights: [0.02, 0.60, 0.38]
  validation_horizon_weights: [0.02, 0.60, 0.38]
  validation_selection_metric: decision_aligned_utility
  validation_asset_increment_weight: 0.40
  validation_sleeve_increment_weight: 0.60
  validation_decision_minimum_component_weight: 0.20
  validation_decision_positive_reward: 0.0
  validation_correction_alpha: 1.0

  d_model: 40
  n_heads: 4
  num_layers: 2
  dim_feedforward: 112
  dropout: 0.25
  learning_rate: 0.00003
  weight_decay: 0.030
  minimum_epochs: 40
  patience: 60
  validation_every_epochs: 5
  min_delta: 0.00002
  checkpoint_rank_min_score: -0.02
  checkpoint_rank_loss_relative_tolerance: 0.20
  self_supervised_pretraining:
    freeze_encoder_epochs: 30

  blend_min_calibration_years: 3
  asset_residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]
  sleeve_residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v27_decision_mean_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v27_decision_mean_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v27_decision_mean_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v27_decision_mean_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v27_decision_mean_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v27_decision_mean_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v27_decision_mean_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v27_decision_mean_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v27_decision_mean_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v27_decision_mean_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v27_decision_mean_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v27_decision_mean_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v27_decision_mean_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v27_decision_mean_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v27_decision_mean_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v27_decision_mean_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v27_decision_mean_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v27_decision_mean_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v27_decision_mean_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v27_decision_mean_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v27_decision_mean_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v27_decision_mean_point_in_time_audit.csv
