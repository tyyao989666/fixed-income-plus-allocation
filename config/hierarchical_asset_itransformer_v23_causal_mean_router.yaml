base_config: hierarchical_asset_itransformer_v22_residual_utility.yaml
version: hierarchical_asset_itransformer_v23_causal_mean_router

data:
  # These are mean-view experts only. Volatility and covariance remain separate
  # EP/skfolio inputs and never enter the expected-return ranking.
  signal_expert_blends:
    - name: fast_trend
      windows_days: [5, 20]
      weights: [0.35, 0.65]
      direction: 1
    - name: intermediate_trend
      windows_days: [20, 60, 120]
      weights: [0.15, 0.55, 0.30]
      direction: 1
    - name: fast_reversal
      windows_days: [5, 20]
      weights: [0.70, 0.30]
      direction: -1
  include_card_rank_expert: true
  include_mechanical_view_expert: true

model:
  # The iTransformer is a causal router over interpretable mean-view experts.
  # It cannot emit an unconstrained return forecast.
  prediction_target_mode: direct_rank
  prediction_head_mode: adaptive_expert_mixture
  orthogonal_residual: false
  residual_shrinkage_weight: 0.0

  # One routing decision is shared within each asset sleeve; the sleeve router
  # makes one cross-sectional decision for all five sleeves.
  asset_expert_gate_scope: module_shared
  sleeve_expert_gate_scope: cross_section_shared
  expert_initial_baseline_probability: 0.90
  expert_adaptation_scale: 0.65
  expert_gate_temperature: 1.30
  expert_gate_deviation_weight: 0.04

  # Oracle labels compare cross-sectional ordering, not MSE. This makes expert
  # choice invariant to signal scale. A non-baseline expert must clear a small
  # edge before it is preferred to the fixed causal anchor.
  expert_routing_loss_weight: 0.75
  expert_oracle_metric: cross_sectional_correlation
  expert_oracle_temperature: 0.12
  expert_oracle_minimum_assets: 2
  expert_oracle_nonbaseline_margin: 0.03

  asset_loss_weight: 0.05
  sleeve_loss_weight: 0.08
  asset_pairwise_loss_weight: 0.75
  sleeve_pairwise_loss_weight: 0.95
  listwise_rank_loss_weight: 0.40
  uncertainty_weight: 0.01
  learning_rate: 0.00006
  weight_decay: 0.020
  minimum_epochs: 25
  patience: 35

  # The model output is already internally shrunk toward expert zero, so the
  # complete routed view is used for checkpoint diagnostics. Deployment alpha
  # is still selected only from matured prior walk-forward predictions.
  validation_correction_alpha: 1.0
  asset_residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]
  sleeve_residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]
  blend_min_calibration_years: 3

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v23_causal_mean_router_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v23_causal_mean_router_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v23_causal_mean_router_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v23_causal_mean_router_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_gate.json
  expert_library_audit: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_expert_library_audit.csv
  expert_usage: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_expert_usage.csv
  report_md: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v23_causal_mean_router_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v23_causal_mean_router_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v23_causal_mean_router_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v23_causal_mean_router_point_in_time_audit.csv
