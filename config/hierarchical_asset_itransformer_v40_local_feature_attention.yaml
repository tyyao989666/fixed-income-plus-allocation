base_config: hierarchical_asset_itransformer_v37_rank_selected_encoder_finetune.yaml
version: hierarchical_asset_itransformer_v40_local_feature_attention

model:
  # The original local stage projected each feature's 120-day history and then
  # pooled the feature tokens independently. One lightweight inverted-token
  # block lets OHLCV, return, volatility, liquidity and state-card histories
  # interact inside each asset before cross-asset/macro attention.
  local_num_layers: 1
  local_n_heads: 4
  local_dim_feedforward: 96

outputs:
  model_dir: data_processed/hierarchical_asset_itransformer_v40_local_feature_attention_models
  controller_model_dir: data_processed/hierarchical_asset_itransformer_v40_local_feature_attention_controller_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v40_local_feature_attention_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v40_local_feature_attention_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v40_local_feature_attention_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v40_local_feature_attention_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v40_local_feature_attention_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v40_local_feature_attention_point_in_time_audit.csv
