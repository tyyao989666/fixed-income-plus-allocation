base_config: hierarchical_asset_itransformer_v37_rank_selected_encoder_finetune.yaml
version: hierarchical_asset_itransformer_v39_module_horizon_objective

model:
  # A single horizon mixture forced economically different sleeves to share
  # conflicting gradients. Each module now learns only the horizons that are
  # plausible for its transmission mechanism. The weights are sparse and
  # coarse by design; they are not tuned to one portfolio backtest.
  asset_module_horizon_loss_weights:
    rates: [0.00, 0.00, 1.00]
    credit: [0.15, 0.30, 0.55]
    convertible_bonds: [0.25, 0.00, 0.75]
    equity: [0.00, 0.00, 1.00]
    alternatives: [0.25, 0.00, 0.75]

  # Equal module aggregation prevents the larger equity/convertible universes
  # from dominating rates, credit and alternatives in the regression term.
  asset_module_loss_weights:
    rates: 1.00
    credit: 1.00
    convertible_bonds: 1.00
    equity: 1.00
    alternatives: 1.00

  # Cross-sleeve allocation is strategic. Five-day supervision is retained
  # only as a small auxiliary task; the unstable 20-day sleeve objective is
  # nearly removed.
  sleeve_horizon_loss_weights: [0.10, 0.05, 0.85]
  validation_sleeve_horizon_weights: [0.10, 0.05, 0.85]

outputs:
  model_dir: data_processed/hierarchical_asset_itransformer_v39_module_horizon_objective_models
  controller_model_dir: data_processed/hierarchical_asset_itransformer_v39_module_horizon_objective_controller_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v39_module_horizon_objective_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v39_module_horizon_objective_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v39_module_horizon_objective_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v39_module_horizon_objective_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v39_module_horizon_objective_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v39_module_horizon_objective_point_in_time_audit.csv
