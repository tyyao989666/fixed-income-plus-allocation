base_config: hierarchical_asset_itransformer_v42_causal_linear_probe.yaml
version: hierarchical_asset_itransformer_v43_clean_calendar

# This formal rerun uses a real trading-day anchor rather than every date found
# in the mixed macro panel. It keeps the final coherent pre-refresh cutoff.
data:
  final_date: "2026-07-15"
  trading_calendar_mode: anchor_asset
  trading_calendar_anchor_asset: equity_broad

# The older monthly anchor selected only 30Y and 7-10Y rate proxies even
# though the model universe contains four curve tenors.  Preserve its total
# rates sleeve while allocating it across all four predeclared curve proxies.
# These splits are strategic, fixed before the test, and are not fitted to
# realised portfolio performance.
portfolio:
  formal_anchor_rate_split:
    low_vol:
      rate_1_3y: 0.20
      rate_3_5y: 0.25
      rate_7_10y: 0.30
      rate_30y_curve_proxy: 0.25
    balanced:
      rate_1_3y: 0.10
      rate_3_5y: 0.20
      rate_7_10y: 0.35
      rate_30y_curve_proxy: 0.35
    high_vol:
      rate_1_3y: 0.05
      rate_3_5y: 0.10
      rate_7_10y: 0.35
      rate_30y_curve_proxy: 0.50

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v43_clean_calendar_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_metadata.json
  model_dir: data_processed/hierarchical_asset_itransformer_v43_clean_calendar_models
  controller_model_dir: data_processed/hierarchical_asset_itransformer_v43_clean_calendar_controller_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v43_clean_calendar_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v43_clean_calendar_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v43_clean_calendar_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v43_clean_calendar_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v43_clean_calendar_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_point_in_time_audit.csv
  bootstrap_report: output/reports/hierarchical_asset_itransformer_v43_clean_calendar_bootstrap_robustness.csv
