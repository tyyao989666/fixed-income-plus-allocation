base_config: hierarchical_asset_itransformer_v35_mean_view_rank_selection.yaml
version: hierarchical_asset_itransformer_v36_rank_selected_strategic60

model:
  # The forecasting model sets the strategic relative-mean target. Daily
  # execution and rebalance timing remain the PPO's job, so the highly
  # overlapping 5/20-day labels are excluded from this clean ablation.
  asset_horizon_loss_weights: [0.00, 0.00, 1.00]
  sleeve_horizon_loss_weights: [0.00, 0.00, 1.00]
  validation_asset_horizon_weights: [0.00, 0.00, 1.00]
  validation_sleeve_horizon_weights: [0.00, 0.00, 1.00]
  asset_enabled_horizons_days: [60]
  sleeve_enabled_horizons_days: [60]

outputs:
  model_dir: data_processed/hierarchical_asset_itransformer_v36_rank_selected_strategic60_models
  controller_model_dir: data_processed/hierarchical_asset_itransformer_v36_rank_selected_strategic60_controller_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v36_rank_selected_strategic60_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v36_rank_selected_strategic60_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v36_rank_selected_strategic60_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v36_rank_selected_strategic60_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v36_rank_selected_strategic60_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v36_rank_selected_strategic60_point_in_time_audit.csv
