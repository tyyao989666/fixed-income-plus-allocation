base_config: hierarchical_asset_itransformer_v30_causal_gate_average.yaml
version: hierarchical_asset_itransformer_v31_fold_scaled_mean

model:
  # Fit one robust scale per forecast horizon and economic module using only
  # the purged training slice of each walk-forward fold. Predictions remain in
  # annualized relative-return units; only the regression loss is normalized.
  regression_loss_scale_mode: fold_train_robust
  asset_regression_loss_scale_floor: 0.02
  sleeve_regression_loss_scale_floor: 0.03
  regression_loss_scale_ceiling: 1.50
  regression_huber_beta: 0.75

  # iTransformer estimates conditional relative means. Actual path-dependent
  # turnover belongs downstream in EP/skfolio and the execution-only PPO. The
  # old shadow-allocation loss charged every date as if trading from equal
  # weight and therefore optimized a different problem.
  asset_loss_weight: 1.00
  sleeve_loss_weight: 1.00
  asset_pairwise_loss_weight: 0.35
  sleeve_pairwise_loss_weight: 0.45
  asset_decision_loss_weight: 0.00
  sleeve_decision_loss_weight: 0.00
  residual_shrinkage_weight: 0.02

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v31_fold_scaled_mean_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v31_fold_scaled_mean_point_in_time_audit.csv
