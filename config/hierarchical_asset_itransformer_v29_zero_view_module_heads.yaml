base_config: hierarchical_asset_itransformer_v28_role_aligned_mean.yaml
version: hierarchical_asset_itransformer_v29_zero_view_module_heads

data:
  # Momentum, nine-grid states, asset cards, OHLCV and macro variables remain
  # causal inputs. They are no longer silently added to the learned score.
  forecast_baseline_mode: zero_active_view
  require_baseline_for_target: false

model:
  # The network predicts the direct annualized relative mean view consumed by
  # EP/skfolio. A zero blend alpha therefore means exactly zero model view.
  prediction_target_mode: direct_mean
  baseline_weight_grid: [0.00]
  deployment_score_normalization_scale: 0.10

  # Each sleeve has its own asset-ranking head. The shared frozen iTransformer
  # representation is retained, but rates/credit/CB/equity/alternatives no
  # longer fight through one common output adapter.
  asset_head_scope: module
  component_checkpoint_merge: true
  component_checkpoint_min_delta: 0.00001
  component_checkpoint_max_score_degradation: 0.00010

  # Mean errors must be learned directly. The variance head is calibrated on a
  # detached error and cannot hide a bad mean forecast by inflating variance.
  regression_loss_mode: robust_with_detached_uncertainty
  regression_huber_beta: 0.050
  uncertainty_nll_weight: 0.10

  prediction_output_activation: tanh
  asset_prediction_output_scale: 0.12
  sleeve_prediction_output_scale: 0.10
  residual_shrinkage_weight: 0.20

  asset_loss_weight: 0.30
  sleeve_loss_weight: 0.35
  asset_pairwise_loss_weight: 0.65
  sleeve_pairwise_loss_weight: 0.85
  asset_decision_loss_weight: 20.0
  sleeve_decision_loss_weight: 30.0

  # Formal runs may train for up to 1000 epochs, but checkpoints are selected
  # only on purged pre-cutoff validation utility. Epoch count is never itself
  # evidence of forecast skill.
  max_epochs: 1000
  minimum_epochs: 60
  patience: 100
  validation_every_epochs: 5
  min_delta: 0.00001
  self_supervised_pretraining:
    freeze_encoder_epochs: 1000

  blend_selection_metric: decision_aligned_utility
  blend_min_calibration_years: 2
  asset_residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]
  sleeve_residual_alpha_grid: [0.00, 0.10, 0.25, 0.50, 0.75, 1.00]

gate:
  mode: component_policy
  min_component_observations: 40
  min_component_decision_utility: 0.00000
  min_component_positive_year_fraction: 0.50

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v29_zero_view_module_heads_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v29_zero_view_module_heads_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v29_zero_view_module_heads_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v29_zero_view_module_heads_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v29_zero_view_module_heads_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v29_zero_view_module_heads_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v29_zero_view_module_heads_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v29_zero_view_module_heads_point_in_time_audit.csv
