rebalance:
  frequency: monthly
  signal_lag_periods: 1
  start_date: "2018-01-31"
  end_date: "2026-06-30"

risk_budget:
  sleeve_return_aggregation: preferred_asset_weights
  lookback_months: 36
  min_history_months: 12
  covariance_shrinkage_to_diag: 0.20
  max_iterations: 500
  tolerance: 0.000001
  diagonal_vol_floor: 0.002

ep_skfolio:
  enabled: true
  backend: skfolio_meanrisk_clarabel
  solver: CLARABEL
  mu_lookback_months: 12
  prior_mu_shrinkage: 0.65
  view_mode: mean_rank
  view_rank_center: true
  view_risk_adjustment_enabled: false
  view_mu_scale: 0.004
  trend_lookback_months: [3, 6, 12]
  trend_mu_scale: 0.18
  itransformer_mu_scale: 0.35
  max_abs_mu_tilt: 0.010
  cov_lookback_months: 36
  min_history_months: 12
  covariance_shrinkage_to_diag: 0.20
  covariance_estimator:
    method: sample_shrink
    shrinkage_to_diag: 0.20
    note: "sample_shrink keeps the historical v1 behaviour. Alternative methods: ewma_shrink, rienet_inspired."
    ewma:
      half_life_months: 12
    rienet_cleaner:
      half_life_months: 18
      winsorize_z: 4.0
      eigen_shrinkage: 0.45
      vol_shrinkage_to_median: 0.20
      max_condition_number: 25.0
      min_eigenvalue: 0.0001
  risk_aversion: 1.15
  base_deviation_penalty: 12.0
  turnover_penalty: 0.45
  max_active_deviation: 0.020
  max_sleeve_turnover: 0.08
  cov_jitter: 0.0000001
  max_iterations: 300
  tolerance: 0.000000001
  note: EP将MarketSkill/Agentic views作为后验均值排序信号，不作为风险/协方差视图；趋势和iTransformer预测同样只进入袖套后验收益，skfolio MeanRisk优化器在大类上下限、偏离overlay和换手约束下落袖套权重。

strategy_version_overrides:
  agentic:
    note: "Agentic views use compressed single-call LangGraph outputs. Keep low_vol conservative; mildly strengthen balanced/high_vol view impact based on scripts/83_search_agentic_ep_params.py."
    profiles:
      balanced:
        ep_skfolio:
          view_mu_scale: 0.006
          max_active_deviation: 0.025
          max_abs_mu_tilt: 0.012
        view_tilt_profile_scale:
          balanced: 0.75
      high_vol:
        ep_skfolio:
          view_mu_scale: 0.006
          max_active_deviation: 0.025
          max_abs_mu_tilt: 0.012
        view_tilt_profile_scale:
          high_vol: 0.40

signal_overlays:
  view_application:
    direct_tilt_enabled: true
    ep_mean_enabled: true
    direct_tilt_scale: 1.00
    note: "Keeps the two Market View transmission channels explicit so direct sleeve tilts and EP posterior-mean views can be ablated independently."
  view_preprocessing:
    mode: monthly_pair_mean
    recent_days: 5
    persistence_power: 0.50
    note: "Controls which already-observed daily Market Views enter each month-end rebalance. Candidate modes are selected only on 2018-2024; portfolio execution remains lagged by one month."
  view_reliability:
    enabled: false
    group_by: sleeve_direction
    lookback_months: 36
    min_observations: 8
    prior_strength: 8.0
    sensitivity: 1.0
    minimum_factor: 0.50
    maximum_factor: 1.35
    confidence_weighted: true
    only_downweight: false
    confidence_cap: 1.0
    note: "Causal Beta-shrunk hit-rate calibration. Only outcomes fully realized by the decision month may scale current relative-view confidence."
  rule_output:
    enabled: true
    state_cards_path: data_processed/market_state_cards_daily_v1.parquet
    apply_adjust_speed: false
    adjust_speed_map:
      slow_30_to_45pct: 0.40
      normal_60pct: 0.60
    apply_alt_internal_overlay: false
    alt_overlay_strength: 0.15
    alt_state_weights:
      ALT1:
        alt_gold: 0.62
        alt_us_bond: 0.18
        alt_reits: 0.10
        alt_commodity: 0.04
        alt_nonferrous: 0.03
        alt_chemical: 0.03
      ALT3:
        alt_gold: 0.20
        alt_us_bond: 0.05
        alt_reits: 0.05
        alt_commodity: 0.30
        alt_nonferrous: 0.22
        alt_chemical: 0.18
      ALT4:
        alt_gold: 0.36
        alt_us_bond: 0.18
        alt_reits: 0.28
        alt_commodity: 0.08
        alt_nonferrous: 0.05
        alt_chemical: 0.05
    note: rule_output_object当前作为状态审计和Agent输入；调仓速度与ALT内部overlay已实测但正式关闭，不改变五大袖套总风险预算。
  asset_itransformer:
    enabled: false
    predictions_path: data_processed/asset_itransformer_predictions_monthly.parquet
    blend: 0.80
    temperature: 0.035
    min_assets: 2
    max_asset_share: 0.75
    enabled_modules: [credit, convertible_bonds, equity]
    note: 资产级iTransformer样本外RankIC接近0，正式链路暂时关闭；待Point-in-Time滚动训练通过门控后再启用。
  itransformer_rank:
    enabled: false
    direct_tilt_enabled: true
    ep_mean_enabled: false
    validation_gate:
      status: shadow_rejected_nested_walkforward
      formal_gate_passed: false
      reason: nested_walkforward_development_failure
      cv_rank_ic_2022_2023_2024: [-0.01228, 0.18276, -0.13220]
      cv_median_rank_ic: -0.01228
      cv_min_rank_ic: -0.13220
      baseline_cv_median_rank_ic: 0.08103
      incremental_cv_rank_ic: -0.09332
      adaptive_holdout_rank_ic: 0.11096
      preprocessing_version: daily_timing_v2_identified_multihorizon
    predictions_path: data_processed/itransformer_daily_timing_v2_monthly_oos.parquet
    gate_report_path: output/reports/itransformer_daily_timing_v2_formal_gate.json
    require_live_gate: true
    enabled_profiles: [balanced]
    top_n: 1
    bottom_n: 1
    tilt: 0.015
    min_top_prob: 0.0
    note: V2使用正式balanced资产锚、5/20/60日风险调整相对收益、嵌套walk-forward、变量身份embedding与袖套query；直接倾斜门控未通过，因此本通道关闭。V2 OOS分数只进入独立受约束PPO控制层，不进入EP posterior mean，避免双重计数。
  trend_following:
    enabled: true
    enabled_profiles: [low_vol, balanced, high_vol]
    lookback_months: [3, 6, 12]
    tilt_per_score: 0.034
    max_sleeve_tilt: 0.090
    negative_threshold: 0.0
    positive_threshold: 0.0
    source_sleeves: [convertible_bonds, equity, alternatives]
    receiver_sleeves: [rates, credit]
    note: 基于已实现月度收益的3/6/12月绝对趋势风险刹车；风险袖套趋势转负时只向利率和信用小幅再分配，受产品上下限约束，不使用现金，不替代风险预算。
  risk_on_rotation:
    enabled: false
    enabled_profiles: [low_vol, balanced, high_vol]
    lookback_months: [6, 12]
    require_all_lookbacks_positive: true
    positive_threshold: 0.0
    donor_sleeves: [rates, credit]
    receiver_sleeves: [equity, alternatives]
    top_n: 1
    momentum_scale: 0.10
    profile_max_tilt:
      low_vol: 0.00
      balanced: 0.02
      high_vol: 0.05
    note: 因果风险进攻轮动实验；仅当风险袖套6月和12月趋势同时为正时，才从利率/信用向最强风险袖套增配。正式启用前必须通过开发期消融。
  agentic_asset_views:
    enabled: true
    enabled_profiles: [high_vol]
    enabled_modules: [rates, credit, convertible_bonds, equity, alternatives]
    min_confidence: 0.50
    tilt_per_confidence: 0.10
    max_pair_transfer: 0.10
    max_asset_share: 0.75
    note: 使用Agentic/MarketSkill输出的同袖套资产级relative views做袖套内部再分配；当前只对high_vol启用，因为低波/中波测试显示换手上升且夏普受损；不改变袖套总权重，不允许现金，不允许跨袖套直接落仓位。

  asset_covariance_cleaner:
    enabled: false
    enabled_profiles: [low_vol, balanced, high_vol]
    enabled_modules: [rates, credit, convertible_bonds, equity, alternatives]
    lookback_months: 36
    min_history_months: 12
    min_assets: 2
    blend: 0.35
    max_asset_share: 0.75
    diagonal_vol_floor: 0.002
    cov_jitter: 0.00000001
    covariance_estimator:
      method: rienet_inspired
      rienet_cleaner:
        half_life_months: 18
        winsorize_z: 4.0
        eigen_shrinkage: 0.45
        vol_shrinkage_to_median: 0.20
        max_condition_number: 25.0
        min_eigenvalue: 0.0001
    note: "Asset-level RIEnet-inspired covariance cleaner. It changes only within-sleeve asset shares, not sleeve budgets or EP views."
  asset_momentum:
    enabled: true
    enabled_profiles: [low_vol, balanced, high_vol]
    enabled_modules: [equity, alternatives]
    lookback_months: [6, 12]
    min_history_months: 12
    min_assets: 2
    score_method: raw_momentum
    rank_concentration: 2.0
    negative_momentum_threshold: 0.0
    negative_momentum_multiplier: 0.50
    profile_blend:
      low_vol: 0.06
      balanced: 0.22
      high_vol: 0.38
    max_asset_share: 0.75
    volatility_floor: 0.02
    note: "Causal within-sleeve relative momentum. Month-end data form target shares for next-month execution; sleeve totals and product bounds do not change."

