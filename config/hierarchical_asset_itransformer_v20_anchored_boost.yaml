base_config: hierarchical_asset_itransformer_v19_pretrained_residual.yaml
version: hierarchical_asset_itransformer_v20_anchored_boost

model:
  # The network predicts only a correction. Every supervised objective evaluates
  # baseline + correction against the future relative-return rank, so a model
  # cannot be selected merely because its standalone score looks predictive.
  prediction_target_mode: anchored_rank_boost
  prediction_head_mode: unconstrained
  orthogonal_residual: true
  training_correction_scale: 1.00
  residual_shrinkage_weight: 0.08

  asset_loss_weight: 0.15
  sleeve_loss_weight: 0.20
  asset_pairwise_loss_weight: 0.70
  sleeve_pairwise_loss_weight: 0.95
  listwise_rank_loss_weight: 0.35

  validation_selection_metric: combined_incremental
  validation_asset_increment_weight: 0.55
  validation_sleeve_increment_weight: 0.45
  validation_minimum_component_weight: 0.35
  checkpoint_rank_min_score: -0.02
  checkpoint_rank_loss_relative_tolerance: 0.12

outputs:
  dataset_npz: data_processed/hierarchical_asset_itransformer_v20_anchored_boost_dataset.npz
  metadata: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_metadata.json
  label_diagnostics: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_label_diagnostics.csv
  model_dir: data_processed/hierarchical_asset_itransformer_v20_anchored_boost_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v20_anchored_boost_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v20_anchored_boost_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v20_anchored_boost_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v20_anchored_boost_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v20_anchored_boost_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v20_anchored_boost_point_in_time_audit.csv
