base_config: hierarchical_asset_itransformer_v33_multihorizon_mean.yaml
version: hierarchical_asset_itransformer_v34_multihorizon_finetune

model:
  # Warm the forecasting heads first, then allow the pretrained representation
  # to adapt to the causal mean-view objective. Component-wise checkpoint
  # splicing is disabled because shared encoder states from different epochs
  # cannot be mixed coherently.
  component_checkpoint_merge: false
  checkpoint_average_top_k: 5
  checkpoint_candidate_pool_size: 12
  learning_rate: 0.00002
  weight_decay: 0.04
  self_supervised_pretraining:
    freeze_encoder_epochs: 20

outputs:
  model_dir: data_processed/hierarchical_asset_itransformer_v34_multihorizon_finetune_models
  controller_model_dir: data_processed/hierarchical_asset_itransformer_v34_multihorizon_finetune_controller_models
  asset_predictions: data_processed/hierarchical_asset_itransformer_v34_multihorizon_finetune_asset_predictions.parquet
  sleeve_predictions: data_processed/hierarchical_asset_itransformer_v34_multihorizon_finetune_sleeve_predictions.parquet
  training_log: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_training_log.csv
  training_progress: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_training_progress.jsonl
  validation_report: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_validation.csv
  gate_report: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_gate.json
  report_md: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_method_and_results.md
  target_weights_pattern: data_processed/hierarchical_asset_itransformer_v34_multihorizon_finetune_{profile}_targets_daily.parquet
  decisions_pattern: data_processed/hierarchical_asset_itransformer_v34_multihorizon_finetune_{profile}_decisions.parquet
  holdings_pattern: data_processed/hierarchical_asset_itransformer_v34_multihorizon_finetune_{profile}_weights_daily.parquet
  daily_pattern: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_{profile}_daily.csv
  metrics_pattern: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_{profile}_metrics.csv
  controller_log_pattern: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_{profile}_controller_training.csv
  portfolio_summary: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_three_profile_summary.csv
  v6_comparison: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_vs_v6_comparison.csv
  portfolio_gate: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_portfolio_gate.json
  portfolio_report: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_portfolio_results.md
  audit: output/reports/hierarchical_asset_itransformer_v34_multihorizon_finetune_point_in_time_audit.csv
